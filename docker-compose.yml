services:
  mysql:
    image: mysql:8.0
    container_name: insights-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password}
      MYSQL_DATABASE: ${DB_DATABASE:-insights_db}
      MYSQL_USER: ${DB_USERNAME:-insights_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-insights_password}
    ports:
      # Host port 3307 avoids clashing with other local MySQL instances; the backend
      # always talks to it over the internal Docker network on the standard 3306.
      - '${MYSQL_HOST_PORT:-3307}:3306'
    volumes:
      - insights-mysql-data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost']
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - insights-network

  backend:
    build:
      context: ./backend
    container_name: insights-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      API_PREFIX: api
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USERNAME: ${DB_USERNAME:-insights_user}
      DB_PASSWORD: ${DB_PASSWORD:-insights_password}
      DB_DATABASE: ${DB_DATABASE:-insights_db}
      # Prisma — internal Docker network address; the backend/.env used for host-side
      # `prisma migrate`/`generate` commands points at the mapped host port instead.
      DATABASE_URL: mysql://${DB_USERNAME:-insights_user}:${DB_PASSWORD:-insights_password}@mysql:3306/${DB_DATABASE:-insights_db}
      JWT_SECRET: ${JWT_SECRET:-super_secret_change_me_in_production}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1d}
      SUPER_ADMIN_EMAIL: ${SUPER_ADMIN_EMAIL:-admin@insights.local}
      SUPER_ADMIN_PASSWORD: ${SUPER_ADMIN_PASSWORD:-ChangeMe123!}
      SUPER_ADMIN_NAME: ${SUPER_ADMIN_NAME:-Super Admin}
      SUPER_ADMIN_PHONE: ${SUPER_ADMIN_PHONE:-0000000000}
    ports:
      - '3001:3001'
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - insights-network

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001/api}
    container_name: insights-frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001/api}
      INTERNAL_API_URL: http://backend:3001/api
    ports:
      - '3000:3000'
    depends_on:
      - backend
    networks:
      - insights-network

networks:
  insights-network:
    driver: bridge

volumes:
  insights-mysql-data:
